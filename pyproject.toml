[project]
name = "ocr-pipeline"
version = "0.1.0"
description = "Durable, asynchronous multi-page OCR pipeline powered by Inngest, PostgreSQL, and MLX (Unlimited-OCR-2-8bit) / llama.cpp"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "inngest>=0.4.19",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.4.0",
    "httpx>=0.27.2",
    "loguru>=0.7.2",
    "mlx-vlm>=0.1.15; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torchvision>=0.19.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
mlx-vlm = { git = "https://github.com/shuuul/mlx-vlm.git" }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
